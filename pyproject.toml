[project]
name = "mirage"
version = "0.1.0"
description = "Mirage: an LLM-powered adaptive SSH honeypot that never executes attacker commands."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "asyncssh>=2.14",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["honeypot", "analyzer", "api", "llm"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W", # pycodestyle + pyflakes
    "I",           # import sorting
    "B",           # bugbear
    "UP",          # pyupgrade
    "SIM",         # simplifications
    "ASYNC",       # async pitfalls
    "S",           # security (bandit)
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"] # asserts and fake credentials are fine in tests

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["honeypot", "analyzer", "api", "llm"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncssh.*"]
ignore_missing_imports = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "live: calls a real LLM provider; skipped unless the matching API key is set",
    "integration: needs running postgres/redis",
]

[tool.coverage.run]
source = ["honeypot", "analyzer", "api", "llm"]
branch = true
